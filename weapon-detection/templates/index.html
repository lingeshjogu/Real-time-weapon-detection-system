<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Real-Time Weapon Detection</title>
<style>
:root{--bg:#0e1116;--card:#171b22;--line:#262c36;--tx:#e6e9ef;--mut:#8a93a3;--c:#3fb950}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,Segoe UI,sans-serif}
header{padding:14px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
h1{font-size:18px;margin:0}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:8px}
main{display:grid;grid-template-columns:2fr 1fr;gap:16px;padding:16px 24px}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 10px}
#feed{width:100%;border-radius:8px;display:block;border:3px solid var(--c)}
#banner{font-size:26px;font-weight:700;color:var(--c);margin-bottom:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat b{display:block;font-size:22px}.stat span{color:var(--mut);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
td img{height:34px;border-radius:4px;vertical-align:middle}
.tag{padding:2px 7px;border-radius:5px;font-size:11px;font-weight:600}
.HIGH{background:#5a2d00;color:#ffa657}.CRITICAL{background:#5c0f0f;color:#ff7b72}
input[type=range]{width:100%}
</style></head><body>
<header><h1><span class="dot" id="dot"></span>Real-Time Weapon Detection System</h1><span style="color:var(--mut);font-size:13px">YOLOv8 • Temporal confirmation • Evidence logging</span></header>
<main>
 <div class="card"><h2>Live feed</h2><img id="feed" src="/video_feed" alt="live"></div>
 <div style="display:flex;flex-direction:column;gap:16px">
  <div class="card"><h2>Threat level</h2><div id="banner">SAFE</div>
   <div class="grid" style="margin-top:10px">
    <div class="stat"><b id="fps">0</b><span>FPS</span></div><div class="stat"><b id="lat">0</b><span>Latency (ms)</span></div>
    <div class="stat"><b id="wp">0</b><span>Weapons in view</span></div><div class="stat"><b id="pp">0</b><span>Persons</span></div>
    <div class="stat"><b id="al">0</b><span>Alerts this session</span></div></div></div>
  <div class="card"><h2>Sensitivity (confidence)</h2>
   <input type="range" min="0.2" max="0.9" step="0.05" value="{{conf}}" id="sl"><div id="cv" style="color:var(--mut);font-size:13px">{{conf}}</div></div>
  <div class="card"><h2>Recent alerts</h2><table><thead><tr><th>Time</th><th>Level</th><th>Object</th><th></th></tr></thead><tbody id="ev"></tbody></table></div>
 </div>
</main>
<script>
const C={SAFE:'#3fb950',LOW:'#e3b341',HIGH:'#ff8c1a',CRITICAL:'#ff3b30'};
async function tick(){
 try{const s=await (await fetch('/api/status')).json();
  document.documentElement.style.setProperty('--c',C[s.level]);
  banner.textContent=s.level;fps.textContent=s.fps.toFixed(1);lat.textContent=s.latency_ms;
  wp.textContent=s.weapons;pp.textContent=s.persons;al.textContent=s.alerts;}catch(e){}
}
async function events(){
 try{const e=await (await fetch('/api/events')).json();
  ev.innerHTML=e.map(x=>`<tr><td>${x.ts.slice(11)}</td><td><span class="tag ${x.level}">${x.level}</span></td><td>${x.label} ${Math.round(x.conf*100)}%</td><td><a href="/evidence/${x.image}" target="_blank"><img src="/evidence/${x.image}"></a></td></tr>`).join('');}catch(e){}
}
sl.oninput=()=>{cv.textContent=sl.value;fetch('/api/conf',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conf:+sl.value})});};
setInterval(tick,500);setInterval(events,2000);tick();events();
</script></body></html>
